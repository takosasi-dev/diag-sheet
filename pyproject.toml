[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diagsheet"
version = "0.1.0"
description = "診断ツールの結果 JSON を、共通の形(JSON と Markdown)のシートに写す"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "takosasi-dev" }]
dependencies = []

[project.scripts]
diagsheet = "diagsheet.__main__:main"

[tool.setuptools.packages.find]
include = ["diagsheet*"]

[tool.setuptools.package-data]
diagsheet = ["mappings/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 日本語の文と注釈で全角の記号を使うので、紛らわしい文字の警告は外す。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
